unbind-key -a -T root

# set -g default-terminal "screen-256color"
# # Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0
# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000
# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000
# Focus events enabled for terminals that support them
set -g focus-events on
# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

set -g prefix C-Space # another prefix
bind Space send-prefix

set -g pane-border-lines "double"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g mode-keys vi

set -g mouse on

set -s escape-time 0

set -g history-limit 2000

bind -n M-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind -n M-s choose-tree -s

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-S-Left resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up resize-pane -U 3
bind -n M-S-Down resize-pane -D 3

bind -n M-h split-window -v
bind -n M-v split-window -h

bind -n M-Enter new-window
bind -n M-c kill-pane
bind -n M-q kill-window
bind -n M-d detach
bind -n M-Q confirm-before -p "Kill entire session? (y/n)" kill-session

#Копирование, доп клавиша
bind -n M-c copy-mode

bind -n M-/ copy-mode \; command-prompt -p "(search down)" "send -X search-forward '%%%'"
bind -n M-? copy-mode \; command-prompt -p "(search up)"   "send -X search-backward '%%%'"

# Скролл вверх на пол-экрана по Ctrl+PageUp
bind -n C-PAGEUP copy-mode \; send-keys -X halfpage-up
# Скролл вниз на пол-экрана по Ctrl+PageDown
bind -n C-PAGEDOWN copy-mode \; send-keys -X halfpage-down

# Альтернатива: Скролл построчно стрелками с зажатым Ctrl (если терминал пропускает эти сочетания)
bind -n C-Up copy-mode \; send-keys -X scroll-up
bind -n C-Down copy-mode \; send-keys -X scroll-down
# Переключение ОКОН (вкладок) влево/вправо через Ctrl+Стрелки
bind -n C-S-Left previous-window
bind -n C-S-Right next-window

# --- Навигация Ctrl+hjkl (альтернатива Alt+стрелки, часто удобнее) ---
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# bind -T copy-mode-vi v send -X begin-selection
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy || xclip -in -selection clipboard"

bind -T copy-mode-vi y send -X copy-selection-and-cancel
# встроенная поддержка буфера обмена, в новых версиях 3.2+
set -g set-clipboard on


set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'egel/tmux-gruvbox'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
run '~/.config/tmux/plugins/tpm/tpm'

# --- Плагин для копирования (вместо ручного wl-copy/xclip) ---
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'tmux-plugins/tmux-sidebar'


# ==========================================
# 1. АВТОМАТИЧЕСКОЕ ИЗМЕНЕНИЕ ЦВЕТА ПО SSH
# ==========================================

# Проверяем SSH-соединение и устанавливаем цвет статусной строки
if-shell '[ -n "$SSH_CONNECTION" ]' 'set -g status-style "bg=red,fg=white"' 'set -g status-style "bg=green,fg=black"'
if-shell '[ -n "$SSH_CONNECTION" ]' 'set -g status-left "#[fg=white,bg=red] 🌐 #H "' 'set -g status-left "#[fg=black,bg=green] 💻 #H "'

# ==========================================
# 2. ОТКЛЮЧЕНИЕ КЛАВИШ ПО F12
# ==========================================

# Отключаем клавиши во внешней сессии по F12
bind -T root F12 \
  set prefix None \; \
  set key-table off \; \
  set status-style "bg=red,fg=white" \; \
  set status-left "#[fg=white,bg=red] [OFF] #H " \; \
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \; \
  refresh-client -S

# Включаем клавиши обратно по повторному F12
bind -T off F12 \
  set -u prefix \; \
  set -u key-table \; \
  set -u status-style \; \
  set -u status-left \; \
  refresh-client -S
